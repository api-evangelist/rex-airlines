actions:
  apisListed: 0
  apisYmlCreated: true
  openapiHarvested: false
  specsCount: 0
  reason: >-
    apis[] is deliberately empty. Rex publishes no documented API. The "Request
    API Access" checkbox proves an interface exists but nothing about it is
    published — no name, no base URL, no protocol, no reference documentation —
    so listing it would require inventing facts. It is recorded here as
    evidence instead, and the travel agent portal is carried in common[] where
    it belongs.
