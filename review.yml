aid: rex-airlines
name: Rex Airlines
review:
  question: >-
    Does Rex Airlines publish a public developer portal, documented API, or NDC
    distribution surface — and what would it cost a customer to leave?
  answer: false
  date: '2026-07-28'
  reviewer: API Evangelist
  tier: airline
  homeMarket: Australia
  primaryDomain: rex.com.au
findings:
  summary: |
    Rex Airlines publishes no developer portal, no API documentation, no OpenAPI
    or other machine-readable contract, and makes no reference to IATA NDC
    anywhere on rex.com.au. Every developer-convention subdomain fails DNS
    (developer., developers., api., docs.) and every conventional spec path
    returns 404. The site does not even serve /robots.txt or /sitemap.xml.

    The one real, verifiable trace of a programmatic interface is a checkbox
    labelled "Request API Access" (input id `ContentPlaceHolder1_cbAPI`) on the
    Travel Agent registration form. It sits below a mandatory "Travel Agency ID
    number (IATA, DAPA or TIDS)" field. There is no linked specification, no
    name for the API, no base URL, no terms, and no pricing. A developer cannot
    evaluate this interface before signing; they can only tick a box, submit an
    ABN, an Australian travel agency licence number, an accreditation number and
    full bank/BSB details, and wait for approval. Because nothing about it is
    documented, it is deliberately NOT listed in apis[].

    Trade distribution is a web portal, not a machine interface. Agents log in
    at /TravelAgent/Index.aspx and book, amend and pull statements through HTML
    screens. The published FAQ states statements "are updated every 24 hours and
    are kept on the Rex server for a period of 2 months", with download limited
    to "the last 4 months" — a hard, published ceiling on how much of an agency's
    own transaction history it can retrieve.
