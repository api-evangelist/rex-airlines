name: Rex Airlines
kind: company
description: >-
  Rex Airlines (Regional Express, IATA ZL / ICAO RXA) is Australia's second-largest
  regional carrier, headquartered in Mascot, New South Wales, flying a Saab 340 fleet
  to roughly 45 regional destinations across every Australian state. Formed in 2002
  from the merger of Hazelton and Kendell Airlines, Rex entered voluntary administration
  in July 2024 and was acquired by US holding company Air T in December 2025 with
  Australian federal government debt support. In the distribution chain Rex is the
  inventory owner, not an intermediary — it runs Sabre's SabreSonic passenger service
  suite (inventory, reservations, ticketing, ancillaries, check-in) per Sabre's
  February 2021 announcement, sells direct through its own ASP.NET booking engine at
  ibe2.rex.com.au, and reaches trade through a web-only Travel Agent portal gated on
  an IATA, DAPA or TIDS agency number. Its API posture is honest to state plainly:
  no developer portal, no public documentation, no OpenAPI, and no NDC claim
  anywhere on rex.com.au. The only published trace of a programmatic interface is a
  bare "Request API Access" checkbox on the agent registration form — accreditation
  required, contract unspecified, nothing documented, and no exit path beyond a
  privacy-law request to the Customer Contact Centre.
